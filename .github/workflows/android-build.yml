name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖
        run: npm install

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 删除旧密钥并生成新签名
        run: |
          rm -f android/app/debug.keystore
          keytool -genkeypair -v -storetype PKCS12 -keystore android/app/debug.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, ST=Debug, C=US"

      - name: 赋予 gradlew 执行权限
        run: chmod +x android/gradlew

      - name: 构建 Release APK
        run: |
          cd android
          ./gradlew assembleRelease \
            -Prelease.keystore=app/debug.keystore \
            -Prelease.keystore.password=android \
            -Prelease.key.alias=androiddebugkey \
            -Prelease.key.password=android

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
